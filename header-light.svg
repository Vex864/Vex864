<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Michał Bucki, full-stack web developer, Kraków">
<style>
  .bar { transform-box: fill-box; transform-origin: left center; animation: grow 7s ease-in-out infinite; }
  @keyframes grow { 0% { transform: scaleX(0); } 12% { transform: scaleX(1); } 88% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.6); opacity: 0; } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .bar, .cursor, .pulse, .float { animation: none; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0d9488"/><stop offset=".55" stop-color="#0284c7"/><stop offset="1" stop-color="#4f46e5"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#eaeef2" stroke-width="1"/>
  </pattern>
  <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
    <stop offset="0" stop-color="#0284c7" stop-opacity=".10"/>
    <stop offset="1" stop-color="#0284c7" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".2"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <clipPath id="frame"><rect width="1280" height="380" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="380" fill="#ffffff"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <rect width="1280" height="380" fill="url(#fade)"/>
  <rect width="1280" height="380" fill="url(#glow)"/>
  <rect y="376" width="1280" height="4" fill="url(#accent)"/>
</g>
<rect x=".5" y=".5" width="1279" height="379" rx="17.5" fill="none" stroke="#d8dee4"/>

<!-- left: identity -->
<text x="72" y="96" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#57606a">
  <tspan fill="#0d9488">~</tspan>/<tspan fill="#1f2328">vex864</tspan> <tspan fill="#4f46e5">$</tspan> whoami<tspan class="cursor" fill="#0d9488"> ▍</tspan>
</text>
<text x="70" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#1f2328" letter-spacing="-1.5">Michał Bucki</text>
<text x="72" y="214" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="url(#accent)">Full-stack web developer</text>
<text x="72" y="250" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#57606a">Privacy-first websites &amp; web apps for healthcare and small business</text>

<g transform="translate(72 284)">
