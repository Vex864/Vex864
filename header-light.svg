  <text x="40" y="24.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1f2328">Kraków, Poland</text>
  <g transform="translate(168 0)">
    <rect width="235" height="38" rx="19" fill="#ffffff" stroke="#d0d7de"/>
    <circle class="pulse" cx="24" cy="19" r="5" fill="#1a7f37"/>
    <circle cx="24" cy="19" r="5" fill="#1a7f37"/>
    <text x="40" y="24.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1f2328">Open to freelance projects</text>
  </g>
</g>

